name: verify

on:
  push:
  pull_request:

concurrency:
  group: demand-sensing-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m demand_sensing_lite --days 365 --test-days 56 --seed 42 --lead-time 3 --doc 7
